name: Build Guise APK

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "*.md"
      - "**/.gitignore"
      - "LICENSE"
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.build_type) || '["debug","release"]') }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        run: |
          test -n "${ANDROID_HOME:-}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Generate CI signing key
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/guise-ci.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Guise CI, OU=Development, O=Guise, C=CN"

      - name: Build APK
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          variant="${BUILD_TYPE^}"
          ./gradlew ":app:assemble${variant}" \
            --no-daemon \
            --build-cache \
            --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/guise-ci.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Validate APK outputs
        env:
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          set -euo pipefail
          output_dir="app/build/outputs/apk/${BUILD_TYPE}"
          artifact_dir="apk-artifacts/${BUILD_TYPE}"
          mkdir -p "$artifact_dir"

          mapfile -d '' apks < <(
            find "$output_dir" -maxdepth 1 -type f -name "*.apk" \
              ! -name "*-unsigned.apk" -size +500k -print0
          )
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No signed APK larger than 500 KiB was produced in ${output_dir}"
            find app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} \; || true
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            unzip -Z1 "$apk" > "$RUNNER_TEMP/guise-apk-contents.txt"
            grep -Fxq "AndroidManifest.xml" "$RUNNER_TEMP/guise-apk-contents.txt"
            grep -Fxq "classes.dex" "$RUNNER_TEMP/guise-apk-contents.txt"
            cp "$apk" "$artifact_dir/"
          done

          find "$artifact_dir" -type f -name "*.apk" -exec ls -lh {} \;
          (cd "$artifact_dir" && sha256sum ./*.apk)

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Guise-${{ matrix.build_type }}-apk
          path: apk-artifacts/${{ matrix.build_type }}/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Build-reports-${{ matrix.build_type }}-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
